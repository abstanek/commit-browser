<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commit Browser</title>
    <script>
      // Resolve theme before first paint to avoid a flash of the wrong mode.
      (() => {
        const p = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          p === "light" || p === "dark"
            ? p
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        const f = localStorage.getItem("fontSize");
        if (f) document.documentElement.style.setProperty("--ui-font-size", f + "px");
      })();
    </script>
    <script type="module" src="/src/main.ts" defer></script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="segmented" role="group" title="Browse the commit graph, or review a branch against its merge target">
          <button id="mode-graph" class="btn">Graph</button>
          <button id="mode-review" class="btn">Review</button>
          <button id="mode-files" class="btn">Files</button>
        </div>
        <button id="open-repo" class="btn">Open Repository…</button>
        <button id="refresh" class="btn" title="Re-read branches and commits from disk (F5)">
          ⟳ Refresh
        </button>
        <div id="repo-title">
          <span id="repo-name">No repository</span>
          <span id="repo-path"></span>
        </div>
        <div class="spacer"></div>
        <div class="segmented" role="group">
          <button id="font-smaller" class="btn" title="Smaller text">A−</button>
          <button id="font-bigger" class="btn" title="Larger text">A+</button>
        </div>
        <button id="theme-toggle" class="btn" title="Cycle theme: follow system / light / dark"></button>
        <button id="toggle-details" class="btn" title="Show or hide the commit details pane">
          Details
        </button>
      </header>

      <aside id="sidebar">
        <div class="sidebar-controls" id="base-controls" hidden>
          <label for="base-ref">Into</label>
          <select id="base-ref" title="Branch this one would be merged into"></select>
        </div>
        <div class="sidebar-controls">
          <label for="branch-sort">Sort</label>
          <select id="branch-sort">
            <option value="recent">Most recent commit</option>
            <option value="name">Name</option>
          </select>
        </div>
        <div class="section" data-section="locals">
          <div class="section-title">
            <span class="section-toggle"><span class="disclosure">▾</span>Branches</span>
            <span class="section-actions">
              <button class="linkbtn" id="locals-all">all</button>
              <button class="linkbtn" id="locals-none">none</button>
            </span>
          </div>
          <div class="ref-list section-body" id="local-branches"></div>
        </div>
        <div class="section" data-section="remotes">
          <div class="section-title">
            <span class="section-toggle"><span class="disclosure">▾</span>Remotes</span>
            <span class="section-actions">
              <button class="linkbtn" id="remotes-all">all</button>
              <button class="linkbtn" id="remotes-none">none</button>
            </span>
          </div>
          <div class="ref-list section-body" id="remote-branches"></div>
        </div>
      </aside>

      <div
        class="vsplit"
        id="sidebar-splitter"
        data-var="--sidebar-w"
        data-key="sidebar"
        title="Drag to resize, double-click to reset"
      ></div>

      <main id="main">
        <div id="commit-list">
          <div id="list-scroll">
            <div id="list-header">
              <div class="cell graph-pad">Graph</div>
              <div class="cell subject">Description</div>
              <div class="cell author">
                Author<span class="col-grip" data-col="author" title="Drag to resize, double-click to reset"></span>
              </div>
              <div class="cell date">
                Date<span class="col-grip" data-col="date" title="Drag to resize, double-click to reset"></span>
              </div>
              <div class="cell sha">
                Commit<span class="col-grip" data-col="sha" title="Drag to resize, double-click to reset"></span>
              </div>
            </div>
            <div id="rows-wrap">
              <svg id="graph-svg"></svg>
              <div id="rows"></div>
            </div>
            <button id="load-more" class="btn" hidden>Load more commits…</button>
            <div id="list-empty" hidden>No commits — enable a branch on the left.</div>
          </div>
        </div>
        <div id="splitter" hidden></div>
        <section id="details" hidden>
          <div id="detail-meta"></div>
          <div id="detail-body">
            <div id="file-list"></div>
            <div
              class="vsplit"
              data-var="--detail-list-w"
              data-key="detailList"
              title="Drag to resize, double-click to reset"
            ></div>
            <div id="diff-view"></div>
          </div>
        </section>
      </main>

      <section id="review" hidden>
        <div id="review-head">
          <div id="review-summary"></div>
          <div class="spacer"></div>
          <div id="review-nav">
            <button id="commit-prev" class="btn" title="Older commit">◀</button>
            <select id="commit-select" title="Show the whole branch, or one commit"></select>
            <button id="commit-next" class="btn" title="Newer commit">▶</button>
          </div>
        </div>
        <div id="review-message" hidden></div>
        <div id="review-body">
          <div id="review-tree"></div>
          <div
            class="vsplit"
            data-var="--review-tree-w"
            data-key="reviewTree"
            title="Drag to resize, double-click to reset"
          ></div>
          <div id="review-diff"></div>
        </div>
      </section>

      <section id="files" hidden>
        <div id="files-head">
          <span id="files-rev" class="chip local"></span>
          <div id="files-path"></div>
          <div class="spacer"></div>
          <a id="files-download" class="btn" hidden download>Download</a>
        </div>
        <div id="files-body">
          <div id="files-tree"></div>
          <div
            class="vsplit"
            data-var="--files-tree-w"
            data-key="filesTree"
            title="Drag to resize, double-click to reset"
          ></div>
          <div id="files-view"></div>
        </div>
      </section>

      <div id="empty-state">
        <div>
          <h2>Commit Browser</h2>
          <p id="empty-hint">Open a git repository to browse its commit graph.</p>
          <button id="open-repo-empty" class="btn primary">Open Repository…</button>
        </div>
      </div>
    </div>
  </body>
</html>
