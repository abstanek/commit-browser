name: release

# Builds portable artifacts for a published release. The desktop app and the
# web server ship separately for each platform: six files, each self-contained
# apart from the system webview the desktop app borrows.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  server:
    name: server (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl so the one binary runs on any distribution, whatever libc it has.
          - name: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
          - name: macos-universal
            os: macos-latest
            targets: x86_64-apple-darwin,aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # The branch this is pinned from is also how the action chooses a
      # toolchain, through the default it sets for the input below. A bare
      # commit says nothing about which Rust that is, so name it as well.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}

      - run: npm ci

      # The server compiles dist-web/ into itself, so the frontend has to exist
      # before cargo runs.
      - name: Build the frontend
        run: npm run build:web

      - name: Build
        run: |
          for target in ${TARGETS//,/ }; do
            cargo build --release --locked -p commit-browser-server --target "$target"
          done
        env:
          TARGETS: ${{ matrix.targets }}

      - name: Package
        run: |
          mkdir -p dist-artifacts
          case "${{ matrix.name }}" in
            linux-x86_64)
              cp target/x86_64-unknown-linux-musl/release/commit-browser-server .
              strip commit-browser-server
              tar czf "dist-artifacts/commit-browser-server-${TAG}-${{ matrix.name }}.tar.gz" \
                commit-browser-server README.md
              ;;
            macos-universal)
              # One binary that runs on both Apple silicon and Intel.
              lipo -create -output commit-browser-server \
                target/x86_64-apple-darwin/release/commit-browser-server \
                target/aarch64-apple-darwin/release/commit-browser-server
              strip commit-browser-server
              tar czf "dist-artifacts/commit-browser-server-${TAG}-${{ matrix.name }}.tar.gz" \
                commit-browser-server README.md
              ;;
            windows-x86_64)
              cp target/x86_64-pc-windows-msvc/release/commit-browser-server.exe .
              7z a "dist-artifacts/commit-browser-server-${TAG}-${{ matrix.name }}.zip" \
                commit-browser-server.exe README.md
              ;;
          esac
          ls -l dist-artifacts

      - name: Upload to the release
        run: gh release upload "$TAG" dist-artifacts/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage is the portable form on Linux: it carries the webview and
          # the GTK stack the app would otherwise expect the distribution to have.
          - name: linux-x86_64
            os: ubuntu-latest
            args: --bundles appimage
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app
          # No installer: the bare .exe is the portable one, and Windows already
          # has the WebView2 runtime it needs.
          - name: windows-x86_64
            os: windows-latest
            args: --no-bundle

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            fuse3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          toolchain: stable
          targets: ${{ matrix.name == 'macos-universal' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-${{ matrix.name }}

      - run: npm ci

      # tauri.conf.json's beforeBuildCommand builds the frontend, which Tauri
      # then compiles into the binary.
      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          # linuxdeploy and its plugins are themselves AppImages, and the
          # runners have no FUSE to mount them with: unpack and run instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Precaution: linuxdeploy strips what it bundles by default, which has
          # been known to break the webview libraries it pulls in.
          NO_STRIP: true

      - name: Package
        run: |
          mkdir -p dist-artifacts
          case "${{ matrix.name }}" in
            linux-x86_64)
              cp target/release/bundle/appimage/*.AppImage \
                "dist-artifacts/commit-browser-${TAG}-${{ matrix.name }}.AppImage"
              ;;
            macos-universal)
              # Zip rather than ship the .app raw, so the bundle survives download.
              ditto -c -k --keepParent \
                "target/universal-apple-darwin/release/bundle/macos/Commit Browser.app" \
                "dist-artifacts/commit-browser-${TAG}-${{ matrix.name }}.zip"
              ;;
            windows-x86_64)
              cp target/release/commit-browser.exe .
              7z a "dist-artifacts/commit-browser-${TAG}-${{ matrix.name }}.zip" \
                commit-browser.exe README.md
              ;;
          esac
          ls -l dist-artifacts

      - name: Upload to the release
        run: gh release upload "$TAG" dist-artifacts/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
