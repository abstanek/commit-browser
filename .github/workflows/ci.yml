name: ci

on:
  push:
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri's webview and the AppImage tooling are system libraries on Linux;
      # macOS and Windows use the webview the OS already ships.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # The branch this is pinned from is also how the action chooses a
      # toolchain, through the default it sets for the input below. A bare
      # commit says nothing about which Rust that is, so name it as well.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Formatting is the same answer on every platform, so ask once.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - run: npm ci

      # Both bundles, which also type-checks: each build script runs tsc first.
      - name: Build the frontend
        run: |
          npm run build
          npm run build:web

      - name: Build the workspace
        run: cargo build --workspace --locked

      - name: Run the tests
        run: cargo test --workspace --locked
